<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口コミ返信</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #F7F3F1;
    margin: 0;
    padding: 16px;
    color: #2C2C2A;
  }
  .header {
    padding: 14px 16px 12px;
    text-align: center;
  }
  .header .eyebrow {
    font-size: 11px;
    color: #8A8578;
    letter-spacing: 0.08em;
  }
  .header h1 {
    font-size: 17px;
    margin: 4px 0 2px;
  }
  .header .sub {
    font-size: 12px;
    color: #8A8578;
  }
  .badge {
    display: inline-block;
    margin-top: 8px;
    background: #A8536A;
    color: #fff;
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 999px;
  }
    .store-tabs {
         display: flex;
         gap: 6px;
         overflow-x: auto;
         padding: 4px 16px 10px;
         -webkit-overflow-scrolling: touch;
    }
   .store-tabs::-webkit-scrollbar { display: none; }
   .store-tab {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid #E8E1DD;
        background: #fff;
        color: #6E6A63;
        white-space: nowrap;
   }
   .store-tab.active {
        background: #A8536A;
        border-color: #A8536A;
        color: #fff;
        font-weight: 500;
   }
 .status-line {
    text-align: center;
    font-size: 12px;
    color: #8A8578;
    padding: 20px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    border: 1px solid #E8E1DD;
    overflow: hidden;
    max-width: 480px;
    margin: 0 auto 14px;
    padding: 16px;
  }
  .card.done { opacity: 0.5; }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .cust-name { font-size: 15px; font-weight: 700; }
  .visit-date { font-size: 11px; color: #8A8578; margin-top: 1px; }
  .status-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
    background: #F3E3E7;
    color: #7A3549;
    white-space: nowrap;
  }
  .status-chip.done { background: #E7F0E9; color: #4C7A5E; }
     .meta-badges { display: flex; gap: 6px; margin-top: 4px; }
     .meta-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: #ECE7E0; color: #6E6A63; }
  .scores {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 10px 0 12px;
  }
  .score-item { text-align: center; }
  .score-label {
    font-size: 9px;
    color: #A19C93;
    margin-bottom: 4px;
    line-height: 1.2;
    height: 22px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .score-track { height: 4px; background: #ECE7E0; border-radius: 999px; overflow: hidden; }
  .score-fill { height: 100%; background: #C98A9A; border-radius: 999px; }
  .score-num { font-size: 10px; color: #8A8578; margin-top: 3px; font-weight: 500; }
  .review-body {
    font-size: 13px;
    line-height: 1.7;
    background: #FBF9F6;
    border-left: 3px solid #F3E3E7;
    padding: 10px 12px;
    border-radius: 4px;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .draft-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .draft-label span:first-child { font-size: 11px; font-weight: 700; color: #7A3549; }
  .ai-tag {
    font-size: 9px;
    background: #7A3549;
    color: #fff;
    padding: 1px 7px;
    border-radius: 999px;
    font-weight: 500;
  }
  textarea.draft-input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.7;
    padding: 10px 12px;
    border: 1px solid #E8E1DD;
    border-radius: 8px;
    resize: vertical;
    min-height: 100px;
  }
  textarea.draft-input:focus { outline: none; border-color: #A8536A; }
  .char-count { font-size: 10px; color: #A19C93; text-align: right; margin-top: 4px; }
  .char-count.over { color: #B8541F; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-ghost {
    flex: 0 0 auto;
    font-family: inherit;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #E8E1DD;
    background: #fff;
    color: #6E6A63;
  }
  .btn-primary {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: #A8536A;
    color: #fff;
  }
  .btn-primary:disabled { background: #A19C93; }
  .empty-state { text-align: center; padding: 60px 20px; color: #6E6A63; font-size: 13px; }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2C2C2A;
    color: #fff;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">HAIR POCKET ｜ 口コミ返信</div>
  <h1 id="staffName">読み込み中...</h1>
  <div class="sub" id="storeName"></div>
  <div class="badge" id="pendingBadge" style="display:none;"></div>
</div>
 <div id="storeTabs" class="store-tabs" style="display:none;"></div>
 
<div id="statusLine" class="status-line">読み込み中...</div>
<div id="cardList"></div>
<div id="toast"></div>

<script>
// この画面専用のLIFF ID。
// 【重要】/api/config はブログ用のLIFF IDしか返さないため、ここでは使わない。
// (共有のconfigエンドポイントを使うと、liff.init()がブログ側のLIFF IDで
//  初期化されてしまい、LIFF SDKが「URLとLIFF IDの対応が違う」と判断して
//  ブログのエンドポイントへ自動リダイレクトしてしまう不具合があった)
const LIFF_ID = '2010556064-L4SAkv9q';
let currentLineUserId = null;
let staffName = null;
let storeId = null;
   let role = null;
   let isOwnerView = false;
 let selectedStoreTab = 'all';
let reviews = [];

const scoreKeyMap = {
  '雰囲気': 'atmosphere',
  '接客サービス': 'service',
  '技術・仕上がり': 'skill',
  'メニュー・料金': 'price',
  '総合満足度': 'overall',
};

async function init() {
  const statusEl = document.getElementById('statusLine');
  try {
    await liff.init({ liffId: LIFF_ID }).catch(function (err) {
      console.error('LIFF init error', err);
    });

    if (!(liff.isLoggedIn && liff.isLoggedIn())) {
      statusEl.textContent = 'LINEでログインしてください';
      if (liff.login) liff.login();
      return;
    }

    const profile = await liff.getProfile();
    currentLineUserId = profile.userId;
  } catch (e) {
    console.error('初期化エラー', e);
    statusEl.textContent = '初期化に失敗しました';
    return;
  }

  if (!currentLineUserId) {
    statusEl.textContent = 'LINEアカウントを確認できませんでした';
    return;
  }

  try {
    const meRes = await fetch('/api/reviews/me?lineUserId=' + encodeURIComponent(currentLineUserId));
    const meData = await meRes.json();
    if (!meData.success) {
      statusEl.textContent = meData.error || '担当者情報が見つかりません';
      return;
    }
          staffName = meData.staffName;
         storeId = meData.storeId;
         role = meData.role;
         isOwnerView = role === 'owner';
         document.getElementById('staffName').textContent = staffName + 'さん';
         document.getElementById('storeName').textContent = isOwnerView ? '全店舗(オーナー)' : storeId;
  } catch (e) {
    console.error('担当者情報取得エラー', e);
    statusEl.textContent = '担当者情報の取得に失敗しました';
    return;
  }

  await loadReviews();
}

async function loadReviews() {
  const statusEl = document.getElementById('statusLine');
  statusEl.textContent = '口コミを確認しています...(初回は少し時間がかかります)';
  document.getElementById('cardList').innerHTML = '';

      try {
       const res = await fetch(
               isOwnerView
                 ? '/api/reviews/all?lineUserId=' + encodeURIComponent(currentLineUserId)
                 : '/api/reviews/' + encodeURIComponent(storeId) + '?staff=' + encodeURIComponent(staffName)
             );
    const data = await res.json();
    if (!data.success) {
      statusEl.textContent = data.error || '口コミの取得に失敗しました';
      return;
    }
    reviews = data.reviews.map((r) => ({ ...r, done: false }));
    statusEl.textContent = '';
    render();
  } catch (e) {
    console.error('口コミ取得エラー', e);
    statusEl.textContent = '口コミの取得に失敗しました';
  }
}

function render() {
     renderStoreTabs();
     const list = document.getElementById('cardList');
     const badge = document.getElementById('pendingBadge');
     const pending = reviews.filter((r) => !r.done).length;

     if (pending > 0) {
            badge.style.display = 'inline-block';
            badge.textContent = '未返信 ' + pending + '件';
     } else {
            badge.style.display = 'none';
     }

     const visibleReviews = (isOwnerView && selectedStoreTab !== 'all')
       ? reviews.filter((r) => r.storeId === selectedStoreTab)
            : reviews;

     if (visibleReviews.length === 0) {
            list.innerHTML = '<div class="empty-state">未返信の口コミはありません。おつかれさまです！</div>';
            return;
     }

     list.innerHTML = visibleReviews.map(renderCard).join('');
     bindEvents();
}

   function renderStoreTabs() {
        const tabsEl = document.getElementById('storeTabs');
        if (!isOwnerView) {
               tabsEl.style.display = 'none';
               return;
        }

        const storeMap = {};
        reviews.forEach((r) => {
               const key = r.storeId || 'unknown';
               if (!storeMap[key]) storeMap[key] = { name: r.storeName || key, count: 0 };
               if (!r.done) storeMap[key].count++;
        });

        const storeIds = Object.keys(storeMap);
        if (storeIds.length === 0) {
               tabsEl.style.display = 'none';
               return;
        }

        tabsEl.style.display = 'flex';
        const allCount = reviews.filter((r) => !r.done).length;
        const tabs = [{ id: 'all', name: '全店舗', count: allCount }].concat(
               storeIds.map((id) => ({ id, name: storeMap[id].name, count: storeMap[id].count }))
             );

        tabsEl.innerHTML = tabs.map((t) =>
               '<button class="store-tab ' + (selectedStoreTab === t.id ? 'active' : '') + '" data-store-tab="' + t.id + '">' +
               escapeHtml(t.name) + (t.count > 0 ? ' (' + t.count + ')' : '') +
               '</button>'
             ).join('');

        tabsEl.querySelectorAll('.store-tab').forEach((btn) => {
               btn.addEventListener('click', () => {
                        selectedStoreTab = btn.dataset.storeTab;
                        render();
               });
        });
   }

function renderScores(scores) {
  const entries = Object.entries(scoreKeyMap);
  return (
    '<div class="scores">' +
    entries
      .map(([label]) => {
        const val = scores && scores[label] !== undefined ? scores[label] : null;
        const pct = val ? val * 20 : 0;
        return (
          '<div class="score-item">' +
          '<div class="score-label">' + label + '</div>' +
          '<div class="score-track"><div class="score-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="score-num">' + (val ?? '-') + '</div>' +
          '</div>'
        );
      })
      .join('') +
    '</div>'
  );
}

function renderCard(r) {
     const hasNickname = r.nickname && r.nickname.trim();
     const custLabel = hasNickname ? escapeHtml(r.nickname) + ' 様' : 'ニックネーム未設定のお客様';
     const draftText = escapeHtml(r.aiDraft || '');
     const metaBadges = isOwnerView
       ? '<div class="meta-badges">' +
              '<span class="meta-badge">' + escapeHtml(r.storeName || r.storeId || '') + '</span>' +
              '<span class="meta-badge">' + escapeHtml(r.staff || '担当不明') + '</span>' +
              '</div>'
            : '';
     return (
            '<div class="card ' + (r.done ? 'done' : '') + '" data-id="' + r.reviewId + '" data-store="' + (r.storeId || storeId) + '">' +
            '<div class="card-head">' +
            '<div><div class="cust-name">' + custLabel + '</div>' +
            '<div class="visit-date">' + escapeHtml(r.visitDate || '') + '</div>' +
            metaBadges +
            '</div>' +
            '<div class="status-chip ' + (r.done ? 'done' : '') + '">' + (r.done ? '投稿済み' : '未返信') + '</div>' +
            '</div>' +
            renderScores(r.scores) +
            '<div class="review-body">' + escapeHtml(r.body || '(本文なし)') + '</div>' +
            '<div class="draft-label"><span>返信内容</span><span class="ai-tag">AI下書き</span></div>' +
            '<textarea class="draft-input" data-id="' + r.reviewId + '" maxlength="600" ' +
            (r.done ? 'disabled' : '') + '>' + draftText + '</textarea>' +
            '<div class="char-count" data-id="' + r.reviewId + '">' + draftText.length + ' / 500</div>' +
            '<div class="card-actions">' +
            '<button class="btn-ghost" data-action="regenerate" data-id="' + r.reviewId + '" ' +
            (r.done ? 'disabled' : '') + '>作り直す</button>' +
            '<button class="btn-primary" data-action="post" data-id="' + r.reviewId + '" ' +
            (r.done ? 'disabled' : '') + '>' + (r.done ? '投稿済み' : '投稿する') + '</button>' +
            '</div>' +
            '</div>'
          );
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function bindEvents() {
  document.querySelectorAll('.draft-input').forEach((ta) => {
    ta.addEventListener('input', () => {
      const id = ta.dataset.id;
      const countEl = document.querySelector('.char-count[data-id="' + id + '"]');
      const len = ta.value.length;
      countEl.textContent = len + ' / 500';
      countEl.classList.toggle('over', len > 500);
      const rev = reviews.find((r) => r.reviewId === id);
      if (rev) rev.aiDraft = ta.value;
    });
  });

  document.querySelectorAll('[data-action="regenerate"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
             const cardStoreId = btn.closest('.card').dataset.store;
      btn.disabled = true;
      showToast('下書きを作り直しています...');
      try {
        const res = await fetch(
          '/api/reviews/' + encodeURIComponent(cardStoreId) + '/' + encodeURIComponent(id) + '/regenerate-draft',
          { method: 'POST' }
        );
        const data = await res.json();
        if (data.success) {
          const rev = reviews.find((r) => r.reviewId === id);
          if (rev) rev.aiDraft = data.draft;
          render();
          showToast('下書きを作り直しました');
        } else {
          showToast(data.error || '作り直しに失敗しました');
        }
      } catch (e) {
        console.error(e);
        showToast('作り直しに失敗しました');
      } finally {
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-action="post"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
             const cardStoreId = btn.closest('.card').dataset.store;
      const rev = reviews.find((r) => r.reviewId === id);
      if (!rev) return;

      const ta = document.querySelector('.draft-input[data-id="' + id + '"]');
      const replyContent = ta ? ta.value.trim() : '';

      if (!replyContent) {
        showToast('返信内容が空です');
        return;
      }
      if (replyContent.length > 500) {
        showToast('返信内容が500字を超えています');
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch(
          '/api/reviews/' + encodeURIComponent(cardStoreId) + '/' + encodeURIComponent(id) + '/post',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              staff: rev.staff || staffName,
              nickname: rev.nickname,
              replyContent,
            }),
          }
        );
        const data = await res.json();
        if (data.success) {
          rev.done = true;
          render();
          showToast('投稿を受け付けました(反映まで少し時間がかかります)');
        } else {
          showToast(data.error || '投稿に失敗しました');
          btn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        showToast('投稿に失敗しました');
        btn.disabled = false;
      }
    });
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
